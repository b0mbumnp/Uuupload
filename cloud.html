<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1e">
<meta name="description" content="Private file storage: upload, preview and stream your own files.">
<meta name="robots" content="noindex, nofollow">
<title>My Cloud – private file storage</title>
<style>
  :root {
    --glass: rgba(255,255,255,.09);
    --glass-strong: rgba(255,255,255,.15);
    --border: rgba(255,255,255,.22);
    --fg: #f4f5ff;
    --mut: rgba(244,245,255,.65);
    --a: #7c5cff;
    --b: #22d3ee;
    --c: #ff5caa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    background: #0b0b1e;
    padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  /* animated background */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden;
        background: radial-gradient(circle at 20% 10%, #1a1446, #0b0b1e 60%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55;
          animation: float 18s ease-in-out infinite alternate; }
  .b1 { width: 300px; height: 300px; background: var(--a); top: -60px; left: -80px; }
  .b2 { width: 280px; height: 280px; background: var(--b); bottom: 5%; right: -90px; animation-duration: 22s; }
  .b3 { width: 240px; height: 240px; background: var(--c); top: 40%; left: 20%; animation-duration: 26s; opacity: .35; }
  @keyframes float {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(40px,-50px) scale(1.15); }
    100% { transform: translate(-30px,60px) scale(.95); }
  }

  .wrap { max-width: 720px; margin: 0 auto; }
  .glass {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
  }

  header { text-align: center; margin: 12px 0 20px; animation: rise .7s ease both; }
  h1 { margin: 0; font-size: 34px; letter-spacing: .5px;
       background: linear-gradient(90deg, var(--b), var(--a), var(--c), var(--b));
       background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
       -webkit-text-fill-color: transparent; animation: flow 8s linear infinite; }
  .sub { color: var(--mut); font-size: 13px; margin-top: 4px; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes flow { to { background-position: -300% 0; } }

  /* upload zone */
  .drop { padding: 22px 16px; text-align: center; cursor: pointer; display: block;
          border: 1.5px dashed rgba(255,255,255,.35); transition: .25s; animation: rise .8s .1s ease both; }
  .drop:hover, .drop.over { transform: translateY(-2px); border-color: var(--b); background: var(--glass-strong); }
  .drop .ico { font-size: 38px; display: inline-block; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  .drop b { display: block; margin-top: 6px; }
  .drop small { color: var(--mut); }
  input[type=file] { display: none; }
  #picked { margin: 10px 4px 0; font-size: 13px; color: var(--mut); word-break: break-all; }

  .btn {
    border: 0; color: #fff; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 12px;
    background: linear-gradient(135deg, var(--a), var(--b)); cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px; transition: transform .15s, box-shadow .2s;
    box-shadow: 0 4px 16px rgba(124,92,255,.4);
  }
  .btn:active { transform: scale(.95); }
  .btn.ghost { background: var(--glass-strong); box-shadow: none; border: 1px solid var(--border); }
  .btn.red { background: linear-gradient(135deg, #ff5c7a, #ff8a5c); box-shadow: 0 4px 16px rgba(255,92,122,.35); }
  .btn.full { width: 100%; justify-content: center; margin-top: 12px; padding: 13px; font-size: 15px; }

  /* progress bar */
  .prog { padding: 14px 16px; margin-top: 14px; display: none; }
  .prog.on { display: block; animation: rise .4s ease both; }
  .prow { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; gap: 10px; }
  .prow span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 12px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden;
           box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .fill { height: 100%; width: 0; border-radius: 99px; position: relative; overflow: hidden;
          background: linear-gradient(90deg, var(--a), var(--b), var(--c), var(--a));
          background-size: 300% 100%; animation: flow 2.2s linear infinite;
          box-shadow: 0 0 14px rgba(34,211,238,.8); transition: width .25s ease; }
  .fill::after { content: ""; position: absolute; inset: 0;
                 background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
                 transform: translateX(-100%); animation: shine 1.4s ease-in-out infinite; }
  @keyframes shine { to { transform: translateX(100%); } }
  .track.wait .fill { width: 38% !important; animation: flow 2.2s linear infinite, sweep 1.1s ease-in-out infinite alternate; }
  @keyframes sweep { from { margin-left: 0; } to { margin-left: 62%; } }
  .track.done .fill { background: linear-gradient(90deg, #34d399, #22d3ee); box-shadow: 0 0 14px rgba(52,211,153,.8); animation: none; }
  .track.done .fill::after { display: none; }

  .stats { margin: 22px 4px 10px; display: flex; justify-content: space-between; align-items: center;
           color: var(--mut); font-size: 13px; }

  /* file cards */
  .card { position: relative; padding: 14px; margin-bottom: 12px; animation: rise .5s ease both; transition: transform .2s, box-shadow .2s;
          -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .card.sel { border-color: var(--b); box-shadow: 0 0 0 2px var(--b), 0 8px 32px rgba(0,0,0,.35); }
  .card.sel .name { padding-right: 32px; }
  .card.sel::after { content: "✓"; position: absolute; top: 10px; right: 12px; width: 24px; height: 24px; border-radius: 50%;
          background: linear-gradient(135deg, var(--a), var(--b)); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
  .sbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn.sm { padding: 6px 12px; font-size: 12px; }
  .card:hover { transform: translateY(-2px); }
  .top { display: flex; gap: 12px; align-items: center; }
  .fi { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 24px;
        background: linear-gradient(135deg, rgba(124,92,255,.5), rgba(34,211,238,.4)); border: 1px solid var(--border); }
  .info { min-width: 0; flex: 1; }
  .name { font-weight: 600; font-size: 14.5px; word-break: break-all; line-height: 1.3; }
  .meta { color: var(--mut); font-size: 12px; margin-top: 2px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .acts .btn { padding: 8px 13px; font-size: 13px; }
  .dl { margin-top: 12px; display: none; }
  .dl.on { display: block; }

  .empty { text-align: center; padding: 34px 16px; color: var(--mut); }
  .spin { width: 34px; height: 34px; margin: 0 auto 10px; border-radius: 50%;
          border: 3px solid rgba(255,255,255,.2); border-top-color: var(--b); animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* modal */
  #modal { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; gap: 10px;
           padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
           background: rgba(5,5,18,.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #modal.on { display: flex; animation: fade .25s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .mbar { padding: 8px 10px; display: flex; gap: 10px; align-items: center; }
  #mname { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: hidden; }
  #view img, #view video, #view iframe { max-width: 100%; max-height: 100%; width: 100%; border-radius: 14px; }
  #view iframe { height: 100%; border: 0; background: #fff; }
  #view video { background: #000; }
  #view audio { width: 100%; }

  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
           opacity: 0; padding: 11px 18px; z-index: 30; font-size: 13px; transition: .35s; pointer-events: none; max-width: 90%; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="wrap">
  <header>
    <h1>My Cloud</h1>
    <div class="sub">Upload, preview and stream your files</div>
  </header>

  <label class="glass drop" id="drop">
    <span class="ico">☁️</span>
    <b>Tap to choose files</b>
    <small>or drag and drop here</small>
    <input type="file" id="file" multiple>
  </label>
  <div id="picked"></div>
  <button class="btn full" id="up">⬆️ Upload</button>

  <div class="glass prog" id="uprog">
    <div class="prow"><span id="upname">Uploading…</span><span id="uppct">0%</span></div>
    <div class="track" id="uptrack"><div class="fill" id="upfill"></div></div>
  </div>

  <div class="stats"><span id="count"></span>
    <div class="sbtns">
      <button class="btn ghost sm" id="restore" style="display:none">↺ Restore</button>
      <button class="btn ghost sm" id="clear">✕ Clear</button>
      <button class="btn ghost sm" id="selall" style="display:none">☑ Select all</button>
      <button class="btn ghost sm" id="refresh">↻ Refresh</button>
    </div>
  </div>
  <div id="list"></div>
</div>

<div id="modal">
  <div class="glass mbar"><span id="mname"></span><button class="btn ghost" id="close">✕ Close</button></div>
  <div class="glass" id="view"></div>
</div>
<div class="glass toast" id="toast"></div>

<script>
// 1) Put your NEW Render backend address here (no slash at the end)
const API = "https://uuupload.onrender.com";

let K = localStorage.getItem("k") || "";
const $ = s => document.querySelector(s);
const q = () => encodeURIComponent(K);

function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + " GB";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + " MB";
  return Math.max(1, Math.round(n / 1e3)) + " KB";
}
function icon(m) {
  if (m.startsWith("image/")) return "🖼️";
  if (m.startsWith("video/")) return "🎬";
  if (m.startsWith("audio/")) return "🎵";
  if (m === "application/pdf") return "📕";
  if (m.includes("zip") || m.includes("rar") || m.includes("7z")) return "🗜️";
  return "📄";
}
let tt;
function toast(t) {
  const e = $("#toast"); e.textContent = t; e.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => e.classList.remove("on"), 2600);
}
function askPass() { K = prompt("Password") || ""; return K; }

/* ---------- list ---------- */
async function load() {
  if (!K && !askPass()) return;
  $("#list").innerHTML = '<div class="glass empty"><div class="spin"></div>Loading… the server may take ~30s to wake up</div>';
  try {
    const r = await fetch(`${API}/api/files?k=${q()}`);
    if (r.status === 401) { localStorage.removeItem("k"); K = ""; toast("Wrong password"); return load(); }
    if (!r.ok) {
      let t = "";
      try { t = (await r.json()).detail; } catch (e) { t = "HTTP " + r.status; }
      const b = $("#list"); b.innerHTML = '<div class="glass empty"></div>';
      b.firstChild.textContent = "Server problem: " + (t || r.status);
      return;
    }
    const d = await r.json();
    localStorage.setItem("k", K);
    await savePromise;                         // let a just-made Clear finish saving first
    try {
      const sr = await fetch(`${API}/api/state?k=${q()}`);
      if (sr.ok) { const s = await sr.json(); hidden = new Set(s.hidden); gone = new Set(s.gone); }
    } catch (e) {}
    render(d);
  } catch (e) {
    $("#list").innerHTML = '<div class="glass empty">Could not reach the server. Tap Refresh in a moment.</div>';
  }
}

let ITEMS = [], lastAll = [], hiddenN = 0, countText = "", suppress = false;
// hidden = cleared, can be brought back with Restore.  gone = cleared twice, no Restore any more.
// The lists live on the server (inside your Telegram channel), so they follow you to any phone or browser.
let hidden = new Set(), gone = new Set();
let savePromise = Promise.resolve();
const saveHidden = () => {
  const body = JSON.stringify({ hidden: [...hidden], gone: [...gone] });
  savePromise = savePromise.then(async () => {
    const r = await fetch(`${API}/api/state?k=${q()}`, { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (!r.ok) throw 0;
  }).catch(() => toast("Could not save the cleared list. Try again."));
};
const selected = new Set();

function syncSel() {
  const on = selected.size > 0;
  $("#refresh").style.display = on ? "none" : "";
  $("#selall").style.display = on ? "" : "none";
  $("#restore").style.display = (!on && hiddenN > 0) ? "" : "none";
  $("#selall").textContent = selected.size === ITEMS.length ? "☐ Deselect all" : "☑ Select all";
  $("#count").textContent = on ? selected.size + " selected" : countText;
  document.querySelectorAll("#list .card").forEach(c => c.classList.toggle("sel", selected.has(+c.dataset.id)));
}
function toggleSel(id) { selected.has(id) ? selected.delete(id) : selected.add(id); syncSel(); }
$("#selall").onclick = () => {
  if (selected.size === ITEMS.length) selected.clear(); else ITEMS.forEach(f => selected.add(f.id));
  syncSel();
};

function render(all) {
  lastAll = all;
  const items = all.filter(f => !hidden.has(f.id) && !gone.has(f.id));
  hiddenN = all.filter(f => hidden.has(f.id)).length;
  const box = $("#list"); box.textContent = "";
  const total = items.reduce((a, f) => a + f.size, 0);
  ITEMS = items; selected.clear();
  countText = items.length ? `${items.length} files · ${fmt(total)}` : "";
  if (hiddenN) countText += (countText ? " · " : "") + `${hiddenN} hidden`;
  if (!items.length) {
    box.innerHTML = '<div class="glass empty"></div>';
    box.firstChild.textContent = hiddenN ? "Everything is cleared from this page. Tap Restore to show it again."
      : (gone.size ? "Nothing to show. Upload a new file!" : "No files yet. Upload your first one!");
    syncSel(); return;
  }

  items.forEach((f, i) => {
    const c = document.createElement("div");
    c.className = "glass card"; c.style.animationDelay = Math.min(i * 60, 500) + "ms"; c.dataset.id = f.id;

    // long press = start selecting
    let timer, sx = 0, sy = 0;
    c.addEventListener("pointerdown", e => {
      suppress = false;
      if (e.target.closest("button")) return;
      sx = e.clientX; sy = e.clientY;
      timer = setTimeout(() => { suppress = true; toggleSel(f.id); if (navigator.vibrate) navigator.vibrate(30); }, 500);
    });
    c.addEventListener("pointermove", e => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 12) clearTimeout(timer); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => c.addEventListener(ev, () => clearTimeout(timer)));
    c.addEventListener("contextmenu", e => e.preventDefault());
    c.addEventListener("click", e => {
      if (suppress) { suppress = false; return; }
      if (selected.size && !e.target.closest("button")) toggleSel(f.id);
    });

    const top = document.createElement("div"); top.className = "top";
    const fi = document.createElement("div"); fi.className = "fi"; fi.textContent = icon(f.mime);
    const info = document.createElement("div"); info.className = "info";
    const n = document.createElement("div"); n.className = "name"; n.textContent = f.name;
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = fmt(f.size) + " · " + new Date(f.date).toLocaleDateString();
    info.append(n, m); top.append(fi, info);

    const dl = document.createElement("div"); dl.className = "dl";
    dl.innerHTML = '<div class="prow"><span>Downloading…</span><span class="p">0%</span></div><div class="track"><div class="fill"></div></div>';

    const acts = document.createElement("div"); acts.className = "acts";
    const pv = document.createElement("button"); pv.className = "btn"; pv.textContent = "▶ Preview"; pv.onclick = () => preview(f);
    const dn = document.createElement("button"); dn.className = "btn ghost"; dn.textContent = "⬇ Download"; dn.onclick = () => download(f, dl, dn);
    const del = document.createElement("button"); del.className = "btn red"; del.textContent = "🗑"; del.onclick = () => remove(f);
    acts.append(pv, dn, del);

    c.append(top, dl, acts); box.append(c);
  });
  syncSel();
}

async function remove(f) {
  if (!confirm("Delete " + f.name + "?")) return;
  await fetch(`${API}/api/files/${f.id}?k=${q()}`, { method: "DELETE" });
  toast("Deleted"); load();
}

/* ---------- preview ---------- */
function preview(f) {
  const url = `${API}/api/stream/${f.id}?k=${q()}`;
  const v = $("#view"); v.textContent = "";
  let el;
  if (f.mime.startsWith("image/")) { el = document.createElement("img"); el.src = url; }
  else if (f.mime.startsWith("video/")) { el = document.createElement("video"); el.src = url; el.controls = true; el.autoplay = true; el.playsInline = true; }
  else if (f.mime.startsWith("audio/")) { el = document.createElement("audio"); el.src = url; el.controls = true; el.autoplay = true; }
  else if (f.mime === "application/pdf") { el = document.createElement("iframe"); el.src = url; }
  else { v.textContent = "No preview for this file type. Use Download."; }
  if (el) v.append(el);
  $("#mname").textContent = f.name;
  $("#modal").classList.add("on");
}
$("#close").onclick = () => { $("#modal").classList.remove("on"); $("#view").textContent = ""; };

/* ---------- download with progress ---------- */
async function download(f, box, btn) {
  const url = `${API}/api/stream/${f.id}?k=${q()}&dl=1`;
  if (f.size > 300e6) {            // very big files: let the browser's own download manager handle it
    location.href = url; toast("Download started in your browser"); return;
  }
  const fill = box.querySelector(".fill"), pct = box.querySelector(".p"), track = box.querySelector(".track");
  track.classList.remove("done"); fill.style.width = "0%"; pct.textContent = "0%";
  box.classList.add("on"); btn.disabled = true;
  try {
    const r = await fetch(url);
    if (!r.ok) throw 0;
    const total = +r.headers.get("Content-Length") || f.size;
    const reader = r.body.getReader(), parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      const p = Math.min(100, got / total * 100);
      fill.style.width = p + "%"; pct.textContent = Math.round(p) + "%";
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(parts, { type: f.mime }));
    a.download = f.name; document.body.append(a); a.click(); a.remove();
    track.classList.add("done"); pct.textContent = "Done ✓"; toast("Downloaded " + f.name);
    setTimeout(() => box.classList.remove("on"), 3000);
  } catch (e) {
    toast("Download failed"); box.classList.remove("on");
  }
  btn.disabled = false;
}

/* ---------- upload with progress ---------- */
let curXhr = null, cancelled = false;
const picked = () => [...$("#file").files];
$("#file").onchange = () => {
  $("#picked").textContent = picked().map(f => f.name + " (" + fmt(f.size) + ")").join(", ");
};
const drop = $("#drop");
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => { $("#file").files = ev.dataTransfer.files; $("#file").onchange(); });

function uploadOne(file, i, total) {
  return new Promise(res => {
    const fd = new FormData(); fd.append("k", K); fd.append("file", file);
    const x = new XMLHttpRequest();
    curXhr = x;
    const track = $("#uptrack"), fill = $("#upfill");
    $("#upname").textContent = `(${i}/${total}) ${file.name}`;
    track.classList.remove("wait", "done"); fill.style.width = "0%"; $("#uppct").textContent = "0%";
    x.open("POST", `${API}/api/upload`);
    x.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const p = e.loaded / e.total * 100;
      fill.style.width = p + "%"; $("#uppct").textContent = Math.round(p) + "%";
    };
    x.upload.onload = () => { track.classList.add("wait"); $("#uppct").textContent = "Saving to Telegram…"; };
    x.onload = () => { track.classList.remove("wait"); res(x.status === 200); };
    x.onerror = () => res(false);
    x.onabort = () => res(false);
    x.send(fd);
  });
}

/* ---------- background upload (keeps going if you minimize or close the app) ---------- */
let curBg = null, wl = null;
const swPromise = ("serviceWorker" in navigator && location.protocol === "https:")
  ? navigator.serviceWorker.register("/sw.js").then(() => navigator.serviceWorker.ready).catch(() => null)
  : Promise.resolve(null);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", e => {
    const m = e.data || {};
    if (m.type !== "bg-done") return;
    if (curBg && m.id === curBg.id) finishBg(m.ok); else load();
  });
}

function finishBg(ok) {
  if (!curBg) return;
  curBg = null;
  const track = $("#uptrack"); track.classList.remove("wait");
  if (ok) {
    track.classList.add("done"); $("#upfill").style.width = "100%"; $("#uppct").textContent = "Done ✓";
    toast("Upload complete 🎉");
    $("#file").value = ""; $("#picked").textContent = "";
  } else {
    toast("Upload failed. Check password and channel.");
  }
  $("#up").disabled = false;
  setTimeout(() => $("#uprog").classList.remove("on"), 2500);
  load();
}

function watchBg(bg, label) {
  curBg = bg;
  const track = $("#uptrack"), fill = $("#upfill");
  $("#uprog").classList.add("on"); $("#up").disabled = true;
  $("#upname").textContent = label;
  track.classList.remove("wait", "done");
  const tick = () => {
    const tot = bg.uploadTotal || 0;
    if (tot) {
      const p = Math.min(100, bg.uploaded / tot * 100);
      fill.style.width = p + "%";
      if (bg.uploaded >= tot) { track.classList.add("wait"); $("#uppct").textContent = "Saving to Telegram…"; }
      else $("#uppct").textContent = Math.round(p) + "%";
    }
    if (bg.result === "failure") finishBg(false);
  };
  bg.addEventListener("progress", tick); tick();
}

async function bgUpload(files) {
  const reg = await swPromise;
  if (!reg || !reg.backgroundFetch) return false;
  try {
    const reqs = files.map(f => {
      const fd = new FormData(); fd.append("k", K); fd.append("file", f);
      return new Request(`${API}/api/upload`, { method: "POST", body: fd, mode: "cors" });
    });
    const bg = await reg.backgroundFetch.fetch("up-" + Date.now(), reqs, {
      title: `Uploading ${files.length} file${files.length > 1 ? "s" : ""} to My Cloud`
    });
    watchBg(bg, files.length > 1 ? `${files.length} files (background)` : files[0].name + " (background)");
    return true;
  } catch (e) {
    return false;           // not supported or refused: use the normal upload below
  }
}

// if you closed the app and came back while an upload is still running, show it again
swPromise.then(async reg => {
  if (!reg || !reg.backgroundFetch) return;
  try {
    for (const id of await reg.backgroundFetch.getIds()) {
      const bg = await reg.backgroundFetch.get(id);
      if (bg && !bg.result) watchBg(bg, "Upload running in background");
    }
  } catch (e) {}
});

/* normal upload fallback: keep screen awake so the phone does not pause it */
async function keepAwake() { try { wl = await navigator.wakeLock.request("screen"); } catch (e) {} }
function letSleep() { try { wl && wl.release(); } catch (e) {} wl = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("#up").disabled && !curBg) keepAwake(); });

$("#up").onclick = async () => {
  const files = picked();
  if (!files.length) return toast("Choose a file first");
  if (!K && !askPass()) return;
  cancelled = false;
  const prog = $("#uprog"); prog.classList.add("on"); $("#up").disabled = true;

  // 1) best option: browser background upload
  if (await bgUpload(files)) { toast("Uploading in background. You can minimize or close the app."); return; }

  // 2) fallback: normal upload, page must stay open
  toast("Keep this page open until the upload finishes");
  keepAwake();
  for (let i = 0; i < files.length; i++) {
    const ok = await uploadOne(files[i], i + 1, files.length);
    if (cancelled) { letSleep(); return; }
    if (!ok) { letSleep(); toast("Upload failed: " + files[i].name); $("#up").disabled = false; prog.classList.remove("on"); return; }
  }
  letSleep();
  $("#uptrack").classList.add("done"); $("#upfill").style.width = "100%"; $("#uppct").textContent = "Done ✓";
  toast("Upload complete 🎉");
  $("#file").value = ""; $("#picked").textContent = ""; $("#up").disabled = false;
  setTimeout(() => prog.classList.remove("on"), 2500);
  load();
};

$("#refresh").onclick = load;

// Clear only hides things on THIS page. Nothing is deleted from Telegram, and running uploads keep going.
// 1st Clear  -> hides (Restore button appears).   2nd Clear on an empty page -> Restore is removed for good.
$("#clear").onclick = () => {
  if (selected.size) {                       // something selected: hide only those
    const n = selected.size;
    selected.forEach(id => hidden.add(id)); saveHidden();
    render(lastAll);
    toast(`${n} removed from this page. Still safe in Telegram`);
  } else if (ITEMS.length === 0 && hiddenN > 0) {   // page already cleared: make it final
    hidden.forEach(id => gone.add(id)); hidden.clear(); saveHidden();
    render(lastAll);
    toast("Cleared for good. Files are still in Telegram");
  } else {                                   // nothing selected: clear everything on the page
    ITEMS.forEach(f => hidden.add(f.id)); saveHidden();
    if (!curBg && $("#up").disabled === false) {   // also reset the upload area, unless an upload is running
      $("#file").value = ""; $("#picked").textContent = "";
      $("#uprog").classList.remove("on");
    }
    render(lastAll);
    toast("Cleared from this page. Files are still in Telegram");
  }
};
$("#restore").onclick = () => { hidden.clear(); saveHidden(); render(lastAll); toast("Restored"); };
load();
</script>
